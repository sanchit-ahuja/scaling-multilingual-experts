# Single-family expert training configuration (Qwen3-1.7B)
# Use for training language family specialists
# Usage: python train.py --config_path configs/yaml/train_qwen_single_expert.yaml

model:
  model_name: "Qwen/Qwen3-1.7B-Base"
  use_gradient_checkpointing: false

data:
  families:
    - "Indic"  # Change to target family
  data_fraction: 1.0
  data_prefix: "./data/tokenized"
  max_length: 2048

training:
  train_bsz: 16
  valid_bsz: 16
  grad_accum: 8
  max_steps: 10000
  warmup_steps: 200
  lr: 2.0e-5

checkpoint:
  serialization_dir: "./checkpoints/qwen_indic_expert"
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 5
  run_name: "indic-expert-qwen"
  wandb_project: "qwen-runs"
  wandb_entity: "expert-multilingual-pretraining"
  early_stopping_patience: 3
  early_stopping_threshold: 0.001
  early_stopping_metric: "eval_loss"
