# Layer-range L2-SP regularization training configuration (Qwen3-1.7B)
# Uses different regularization strengths for first/middle/last layers
# Qwen3-1.7B has 28 layers: first 6 + last 4 protected, middle 18 relaxed

model:
  model_name: "Qwen/Qwen3-1.7B-Base"

data:
  families:
    - "Indic"

training:
  train_bsz: 16
  grad_accum: 8
  max_steps: 10000
  warmup_steps: 200
  lr: 2.0e-5

regularizer:
  regularization_type: "layer_range_l2sp"
  lambda_first_layers: 0.1
  lambda_middle_layers: 0.001
  lambda_last_layers: 0.1
  first_layers: 6
  last_layers: 4
  attention_only: false

checkpoint:
  serialization_dir: "./checkpoints/qwen_indic_layer_range"
  eval_steps: 500
  save_steps: 500
  save_total_limit: 5
  run_name: "indic-layer-range-l2sp"
  early_stopping_patience: 3  # Stop after 3 evaluations without improvement
  early_stopping_threshold: 0.001  # Minimum improvement required
  early_stopping_metric: "eval_loss"
