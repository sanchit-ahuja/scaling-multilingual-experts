[project]
name = "x-elm-v2"
version = "0.1.0"
description = "Multilingual LLM continual pre-training with regularization techniques"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "trl>=0.8.0",
    "accelerate>=0.28.0",
    "pyrallis>=0.3.1",
    "wandb>=0.16.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "lang2vec>=1.1.2",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
