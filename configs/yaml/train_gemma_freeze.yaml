# Layer freezing training configuration (Gemma-3-4B)
# Implements Partial SFT/CPT: freezes middle layers, trains first/last layers
# Gemma-3-4B has 34 layers: first 9 + last 6 trainable, middle 19 frozen
# Vision components are auto-stripped by load_model() in utils.py
# Usage: python train.py --config_path configs/yaml/train_gemma_freeze.yaml

model:
  model_name: "google/gemma-3-4b-pt"
  use_gradient_checkpointing: true

data:
  families:
    - "Germanic"  # Change to target family
  data_fraction: 1.0
  data_prefix: "./data/tokenized"
  max_length: 2048

training:
  train_bsz: 4
  valid_bsz: 4
  grad_accum: 12
  max_steps: 16954
  warmup_steps: 200
  lr: 2.0e-5

regularizer:
  regularization_type: "none"
  freeze_middle: true
  first_layers: 9   # Layers 0-8 trainable
  last_layers: 6    # Layers 28-33 trainable
  attention_only: false  # Freeze both attention and MLP

checkpoint:
  serialization_dir: "./checkpoints/gemma_4b_germanic_freeze"
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 5
  run_name: "germanic-freeze-gemma4b"
  wandb_project: "gemma-runs"
  wandb_entity: "expert-multilingual-pretraining"
  early_stopping_patience: 6
  early_stopping_threshold: 0.005
  early_stopping_metric: "eval_loss"
