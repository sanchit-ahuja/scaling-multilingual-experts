# Clean Base-to-Expert retry with exactly layers [5,11) frozen.
# 18,000 steps correspond to roughly 0.35 epoch with the current data iterator.
model:
  model_name: "google/gemma-3-4b-pt"
  use_gradient_checkpointing: true

data:
  families:
    - "Slavic"  # overridden by the launcher
  data_fraction: 1.0
  data_prefix: "/work/nvme/bfzp/madlad-tokenized-5B"
  max_length: 2048

training:
  train_bsz: 4
  valid_bsz: 4
  grad_accum: 12
  max_steps: 18000
  warmup_steps: 200
  lr: 2.0e-5
  seed: 42

regularizer:
  regularization_type: "none"
  freeze_middle: true
  first_layers: 5
  last_layers: 23
  attention_only: false

checkpoint:
  serialization_dir: "/work/nvme/bfzp/checkpoints/gemma_4b_early_window_freeze_matched"
  eval_steps: 500
  save_steps: 500
  save_total_limit: 5
  run_name: "gemma4b-early-window-freeze-matched"
  wandb_project: "gemma-runs"
  wandb_entity: "expert-multilingual-pretraining"
  early_stopping_patience: 0
  early_stopping_threshold: 0.0
  early_stopping_metric: "eval_loss"
