# Gemma-3-4B family CPT with Base-anchored L2-SP only in layers [5,11).
# With 34 layers, first_layers=5 and last_layers=23 make the middle region
# exactly layers 5-10.  Zero coefficients outside that region exclude all
# non-target transformer and non-layer weights from the penalty.
model:
  model_name: "google/gemma-3-4b-pt"
  use_gradient_checkpointing: true

data:
  families:
    - "Slavic"  # overridden by the launcher
  data_fraction: 1.0
  data_prefix: "/work/nvme/bfzp/madlad-tokenized-5B"
  max_length: 2048

training:
  train_bsz: 4
  valid_bsz: 4
  grad_accum: 12
  max_steps: 16954
  warmup_steps: 200
  lr: 2.0e-5
  seed: 42

regularizer:
  regularization_type: "layer_range_l2sp"
  lambda_first_layers: 0.0
  lambda_middle_layers: 0.05
  lambda_last_layers: 0.0
  first_layers: 5
  last_layers: 23
  attention_only: false

checkpoint:
  serialization_dir: "/work/nvme/bfzp/checkpoints/gemma_4b_early_window_l2sp"
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 5
  run_name: "gemma4b-early-window-l2sp"
  wandb_project: "gemma-runs"
  wandb_entity: "expert-multilingual-pretraining"
  early_stopping_patience: 6
  early_stopping_threshold: 0.005
  early_stopping_metric: "eval_loss"
