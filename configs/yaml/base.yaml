# Base configuration for x-elm-v2 continual pre-training
# All experiment configs should override model.model_name with the target model.
# Default: Gemma-3-4B (vision components auto-stripped by utils.py).

model:
  model_name: "google/gemma-3-4b-pt"  # Override per experiment
  initialization_dir: null
  use_gradient_checkpointing: false
  torch_compile: false

data:
  data_prefix: "./data/tokenized"
  families: null  # null = all families
  data_fraction: 1.0
  max_eval_samples: 10000
  max_length: 2048
  packing: true
  packing_strategy: "wrapped"
  num_proc: 4

training:
  train_bsz: 16
  valid_bsz: 16
  grad_accum: 8
  max_steps: 1000
  warmup_steps: 100
  lr: 2.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42

regularizer:
  regularization_type: "none"
  lambda_l2: 0.01
  lambda_first_layers: 0.1
  lambda_middle_layers: 0.001
  lambda_last_layers: 0.1
  num_layers: null  # auto-detected
  first_layers: 6
  last_layers: 4
  exclude_patterns: null
  include_patterns: null
  attention_only: false
  freeze_middle: false
  revert_middle: false

checkpoint:
  serialization_dir: "./checkpoints"
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 10
  resume_from_checkpoint: false
  checkpoint_path: null
  run_name: null
  early_stopping_patience: 0  # 0 to disable early stopping
  early_stopping_threshold: 0.0  # Minimum improvement required
  early_stopping_metric: "eval_loss"  # Metric to monitor

eval:
  eval_only: false
  per_language_eval: false

revert:
  revert_checkpoint_only: false
  revert_output_path: null
